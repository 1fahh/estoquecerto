<div style="width: 390px; height: 1020px; box-sizing: border-box; background: #F4F5F7; color: #16181D; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="height: 60px; flex-shrink: 0; padding: 0 12px; display: flex; align-items: center; gap: 4px">
    <a href="F-Produtos.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 12px; color: #16181D; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>

      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A404C">Nome

        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid #E3E6EB; background: #FFFFFF; color: #3A404C; font-family: inherit; font-size: 13px; font-weight: 600">Filtros</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1.5px solid #E3E6EB; background: #FFFFFF; color: #3A404C; font-family: inherit; font-size: 13px; font-weight: 600">Freios</button>

        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A404C">Unidade
          <select style="height: 50px; box-sizing: border-box; padding: 0 10px; background: #F4F5F7; border: 1.5px solid #E3E6EB; border-radius: 14px; font-family: inherit; font-size: 15px; color: #16181D; min-width: 0"><option>Litro (L)</option></select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A404C"><span>Código <span style="font-weight: 500; color: #5B6270">(opcional)</span></span>
          <input type="text" value="OL-5W30" style="height: 50px; box-sizing: border-box; padding: 0 14px; background: #F4F5F7; border: 1.5px solid #E3E6EB; border-radius: 14px; font-family: inherit; font-size: 15px; color: #16181D; outline: none; min-width: 0">
        </label>

        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A404C">Localização
          <input type="text" value="Prateleira A1" style="height: 50px; box-sizing: border-box; padding: 0 14px; background: #F4F5F7; border: 1.5px solid #E3E6EB; border-radius: 14px; font-family: inherit; font-size: 15px; color: #16181D; outline: none; min-width: 0">
        </label>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: -4px">
        <button type="button" aria-pressed="false" style="height: 48px; border-radius: 14px; border: 1.5px solid #E3E6EB; background: #FFFFFF; color: #3A404C; font-family: inherit; font-size: 15px; font-weight: 700">10%</button>
        <button type="button" aria-pressed="true" style="height: 48px; border-radius: 14px; border: 0; background: #2347D6; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 800">20%</button>
        <button type="button" aria-pressed="false" style="height: 48px; border-radius: 14px; border: 1.5px solid #E3E6EB; background: #FFFFFF; color: #3A404C; font-family: inherit; font-size: 15px; font-weight: 700">30%</button>
        <button type="button" aria-pressed="false" style="height: 48px; border-radius: 14px; border: 1.5px solid #E3E6EB; background: #FFFFFF; color: #3A404C; font-family: inherit; font-size: 14px; font-weight: 700">Outro</button>
      </div>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; color: #3A404C">Nunca menos que (mínimo fixo)
        <input type="text" inputmode="numeric" placeholder="—" style="width: 84px; height: 46px; box-sizing: border-box; padding: 0 12px; background: #F4F5F7; border: 1.5px solid #E3E6EB; border-radius: 12px; font-family: inherit; font-size: 15px; color: #16181D; outline: none; text-align: center">
      </label>
      <div style="background: #FFF1E8; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #7C2D12">
        Você comprou <strong>100 L</strong> da última vez. O aviso chega quando restarem <strong>20 L</strong> — hoje há 18 L, então este produto já está em alerta.
      </div>
    </section>
  </form>

  <div style="padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 6px">
    <a href="F-Produtos.dc.html" style="height: 56px; border-radius: 16px; background: #2347D6; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center">Salvar</a>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="F-Ajuste.dc.html" style="height: 44px; padding: 0 4px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">Conferir saldo (contagem)</a>
      <button type="button" style="height: 44px; border: 0; background: none; color: #3A404C; font-family: inherit; font-size: 14px; font-weight: 600">Inativar produto</button>
    </div>
  </div>
