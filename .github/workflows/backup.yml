name: Backup do banco

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar cliente PostgreSQL 17 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Gerar dump (formato custom)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -eu
          if [ -z "$DATABASE_URL" ]; then
            echo "Segredo DATABASE_URL ausente." >&2
            exit 1
          fi
          nome="estoquecerto-$(date -u +%Y-%m-%d-%H%M).dump"
          pg_dump --format=custom --no-owner --no-acl --dbname="$DATABASE_URL" --file="$nome"
          ls -lh "$nome"
          echo "NOME_DUMP=$nome" >> "$GITHUB_ENV"

      - name: Enviar dump como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME_DUMP }}
          path: ${{ env.NOME_DUMP }}
          retention-days: 30
          if-no-files-found: error
